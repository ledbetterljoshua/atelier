<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forty for Zisis Vergos, dyer</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #d9d4c8; color: #4a453c;
    font: 15px/1.5 Georgia, "Iowan Old Style", "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .hang { position: relative; height: min(calc(100vh - 78px), calc((100vw - 28px) * 1.25)); aspect-ratio: 4 / 5; }
  .string { position: absolute; left: -200vw; right: -200vw; top: 1.6%; border-top: 1px solid #8d8676; }
  canvas, .back { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    box-shadow: 0 1px 2px rgba(60, 50, 30, .25), 0 10px 26px rgba(60, 50, 30, .16); }
  .peg { position: absolute; top: -1.2%; width: 3.4%; height: 5.4%; border-radius: 2px;
    background: linear-gradient(90deg, #b99a6a, #cfb283 45%, #a8895b); box-shadow: 0 1px 2px rgba(40, 30, 10, .4); }
  .peg.a { left: 19%; } .peg.b { left: 77.6%; }
  .back { background: #f1ede3; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 12%; box-sizing: border-box; }
  .back h1 { font-size: clamp(17px, 3.4vh, 26px); font-weight: normal; font-style: italic; margin: 0 0 .9em; }
  .back p { margin: 0 0 .9em; max-width: 26em; font-size: clamp(12.5px, 2.1vh, 16px); }
  .back button { margin-top: .6em; font: inherit; font-size: clamp(13px, 2.2vh, 16px); color: #f4f0e6; background: #5b4a35;
    border: 0; border-radius: 2px; padding: .55em 1.3em; cursor: pointer; }
  .back button:hover, .back button:focus-visible { background: #3f3222; outline: 2px solid #b99a6a; outline-offset: 2px; }
  .cap { font-size: 13px; letter-spacing: .02em; text-align: center; min-height: 3em; padding: 0 12px; }
  .cap i { color: #7a7364; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="hang">
  <div class="string"></div>
  <canvas id="c" hidden aria-label="A dye painting of a man seated at a kitchen table, fading as it is looked at"></canvas>
  <div class="back" id="back">
    <h1>Forty for Zisis Vergos, dyer</h1>
    <p>This is its back. It has not been hung.</p>
    <p>Here a day of light is fifteen seconds of your looking. It is spent only while the page is open in front of you. A forty is not turned to the wall, and nothing spent comes back.</p>
    <button id="hang">Hang it</button>
  </div>
  <div class="peg a"></div><div class="peg b"></div>
</div>
<div class="cap" id="cap"><i>Thomaí Vergou. Six lawful dyes on paper.</i></div>

<script src="sheet.js"></script>
<script>
(function () {
  var S = window.SHEET, KEY = "atelier/thomai-vergou/001";
  var SECONDS_PER_DAY = 15, FORTY = 40;
  var state = { hung: null, days: 0 };
  try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.hung) state = saved; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var canvas = document.getElementById("c"), back = document.getElementById("back"), cap = document.getElementById("cap");
  var W = S.w, H = S.h, N = W * H, nd = S.order.length;
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d"), out = ctx.createImageData(W, H);
  var dens = [], lightQ = new Uint8Array(N), relief = new Float32Array(N), ready = false;

  function load(src) {
    return new Promise(function (ok) {
      var im = new Image();
      im.onload = function () {
        var k = document.createElement("canvas"); k.width = W; k.height = H;
        var g = k.getContext("2d"); g.drawImage(im, 0, 0);
        ok(g.getImageData(0, 0, W, H).data);
      };
      im.src = src;
    });
  }

  Promise.all([load(S.a), load(S.b), load(S.c)]).then(function (px) {
    for (var i = 0; i < nd; i++) {
      var src = px[i < 3 ? 0 : 1], ch = i % 3, a = new Float32Array(N), m = S.dmax[i];
      for (var p = 0; p < N; p++) { var v = src[p * 4 + ch] / 255; a[p] = v * v * m; }
      dens.push(a);
    }
    for (var p = 0; p < N; p++) { lightQ[p] = px[2][p * 4]; relief[p] = 0.8 + 0.4 * px[2][p * 4 + 1] / 255; }
    ready = true;
    if (state.hung) show();
  });

  // one row of 256 per dye and channel: what a unit of that dye takes out, after this much light
  var K = new Float32Array(nd * 3 * 256), LN10 = Math.LN10;
  function render() {
    var days = state.days, i, c, q;
    for (q = 0; q < 256; q++) {
      var e = days * (q / 255) * S.lightMax, tf = Math.exp(-e / S.teaTau);
      for (i = 0; i < nd; i++) {
        var f = Math.exp(-e / S.tau[i]), tea = S.teaYield[i] * (1 - f) * tf;
        for (c = 0; c < 3; c++) K[(i * 3 + c) * 256 + q] = (S.absorb[i][c] * f + S.tea[c] * tea) * LN10;
      }
    }
    var o = out.data, pr = S.paper[0] * 255, pg = S.paper[1] * 255, pb = S.paper[2] * 255;
    for (var p = 0, j = 0; p < N; p++, j += 4) {
      q = lightQ[p];
      var r = 0, g = 0, b = 0;
      for (i = 0; i < nd; i++) {
        var d = dens[i][p];
        if (d > 0.0005) { var base = i * 768 + q; r += d * K[base]; g += d * K[base + 256]; b += d * K[base + 512]; }
      }
      var rl = relief[p];
      o[j] = pr * rl * Math.exp(-r); o[j + 1] = pg * rl * Math.exp(-g); o[j + 2] = pb * rl * Math.exp(-b); o[j + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  var ONES = ["", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth", "eleventh",
    "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth"];
  var TENS = { 20: ["twentieth", "twenty"], 30: ["thirtieth", "thirty"], 40: ["fortieth", "forty"] };
  function ordinal(n) {
    if (n < 20) return ONES[n];
    var t = Math.floor(n / 10) * 10, u = n % 10;
    return u ? TENS[t][1] + "-" + ONES[u] : TENS[t][0];
  }
  function caption() {
    var when = new Date(state.hung).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
    if (state.days >= FORTY) {
      cap.innerHTML = "Forty for Zisis Vergos, dyer. Hung " + when + ".<br><i>Taken down on the fortieth day. This is what is lawful to keep.</i>";
    } else {
      var n = Math.floor(state.days) + 1, note = "";
      if (n === 3) note = " The memorial of the third day."; else if (n === 9) note = " The memorial of the ninth day.";
      cap.innerHTML = "Forty for Zisis Vergos, dyer. Hung " + when + ".<br><i>The " + ordinal(n) + " day." + note + "</i>";
    }
  }

  var seen = true;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) { seen = es[es.length - 1].isIntersecting; }, { threshold: 0.25 }).observe(canvas);
  }
  var last = 0, lastSave = 0, drawn = -1;
  function tick() {
    var now = Date.now();
    if (state.days < FORTY && document.visibilityState === "visible" && seen) {
      var dt = Math.min((now - last) / 1000, 1);        // a stalled tab is not looking
      state.days = Math.min(FORTY, state.days + dt / SECONDS_PER_DAY);
    }
    last = now;
    if (Math.abs(state.days - drawn) > 0.015) { render(); drawn = state.days; caption(); }
    if (now - lastSave > 2000) { save(); lastSave = now; }
  }
  function show() {
    back.hidden = true; canvas.hidden = false;
    render(); drawn = state.days; caption();
    last = Date.now();
    setInterval(tick, 250);
  }
  document.getElementById("hang").addEventListener("click", function () {
    if (!ready) return;
    state = { hung: new Date().toISOString(), days: 0 };
    save(); show();
  });
  addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", save);
})();
</script>
</body>
</html>
